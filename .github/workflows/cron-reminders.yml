name: Streak xatırlatma bildirişləri

# Bu iş /api/cron/reminders-i çağırır — bugün aktiv olmayan, streak-i olan
# istifadəçilərə "streak-in yanır" push göndərir. Əvvəllər Vercel Cron buna
# xidmət edirdi; Cloudflare Workers-ə keçəndən sonra ƏVƏZ EDİLMƏMİŞDİ — endpoint
# CRON_SECRET ilə qorunmuş vəziyyətdə qalmışdı, amma onu çağıran heç kim yox idi.
#
# Niyə Cloudflare Cron Trigger yox: @opennextjs/cloudflare build-i öz worker
# giriş nöqtəsini (.open-next/worker.js) generasiya edir və sənədləşdirilmiş
# scheduled() handler dəstəyi yoxdur — buna əl qatmaq hər `cf:build`-də sınan,
# kövrək həll olardı. GitHub Actions isə tamam ayrı, sadə və repoda görünən yoldur.
#
# Saat 15:00 UTC = 19:00 Bakı vaxtı (UTC+4) — gecə yarısından ~5 saat əvvəl,
# şagirdə seriyasını qorumaq üçün hələ vaxt qalır.
on:
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch: {} # əl ilə test üçün (Actions səkməsindən "Run workflow")

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: /api/cron/reminders çağır
        run: |
          code=$(curl -s -o /tmp/resp.txt -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://imparo.app/api/cron/reminders")
          echo "HTTP $code"
          cat /tmp/resp.txt
          if [ "$code" != "200" ]; then
            echo "::error::Gözlənilməyən status: $code"
            exit 1
          fi
